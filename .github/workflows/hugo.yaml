```yaml
name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DART_SASS_VERSION: 1.104.0
      GO_VERSION: 1.27.0
      HUGO_VERSION: 0.166.0
      NODE_VERSION: 24.20.0
      TZ: Europe/Berlin

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Create a local tools directory
        run: |
          mkdir -p "${HOME}/.local"

      - name: Install Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Node.js
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dart Sass
        run: |
          echo "Installing Dart Sass ${DART_SASS_VERSION}..."

          curl -sfL \
            -o "${{ runner.temp }}/dart-sass.tar.gz" \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"

          tar \
            -C "${HOME}/.local" \
            -xzf "${{ runner.temp }}/dart-sass.tar.gz"

          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      - name: Install Hugo Extended
        run: |
          echo "Installing Hugo Extended ${HUGO_VERSION}..."

          mkdir -p "${HOME}/.local/hugo"

          curl -sfL \
            -o "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"

          tar \
            -C "${HOME}/.local/hugo" \
            -xzf "${{ runner.temp }}/hugo.tar.gz" \
            hugo

          chmod +x "${HOME}/.local/hugo/hugo"

          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

          echo "Installed Hugo binary:"
          "${HOME}/.local/hugo/hugo" version

      - name: Log tool versions
        run: |
          echo "Logging tool versions..."

          echo "Hugo path:"
          command -v hugo

          echo "Hugo version:"
          hugo version

          echo "Dart Sass:"
          command -v sass &> /dev/null \
            && sass --version \
            || echo "not installed"

          echo "Go:"
          command -v go &> /dev/null \
            && go version \
            || echo "not installed"

          echo "Node.js:"
          command -v node &> /dev/null \
            && node --version \
            || echo "not installed"

      - name: Configure Git
        run: |
          echo "Configuring Git..."
          git config --global core.quotepath false

      - name: Install Node.js dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            echo "Installing Node.js dependencies..."
            npm ci
          fi

      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-

      - name: Build
        run: |
          echo "Building the project..."

          hugo build \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/.cache/hugo"

      - name: Cache save
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: false
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
```
